# Upstream to Node.js app
upstream nodejs {
    server 127.0.0.1:8080;
    keepalive 256;
}

# HTTP server - redirect to HTTPS
server {
    listen 80;
    server_name ellarises-intex-1-14.is404.net;
    
    # Allow certbot validation
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }
    
    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl;
    server_name ellarises-intex-1-14.is404.net;

    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/ellarises-intex-1-14.is404.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ellarises-intex-1-14.is404.net/privkey.pem;
    
    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    
    # Proxy to Node.js application
    location / {
        proxy_pass http://nodejs;
        proxy_http_version 1.1;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        
        proxy_buffering off;
        proxy_redirect off;
    }
    
    # Increase timeouts
    proxy_connect_timeout 600;
    proxy_send_timeout 600;
    proxy_read_timeout 600;
    send_timeout 600;
}
